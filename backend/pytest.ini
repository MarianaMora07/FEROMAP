[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
addopts = -ra --tb=short
markers =
    integration: tests que requieren PostgreSQL con seed
    phase_a: checklist Fase A — flujo operativo CE-UNARE-NORTE
    slow: tests lentos (motor ACO real)
filterwarnings =
    ignore::DeprecationWarning
