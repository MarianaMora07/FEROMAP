name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  frontend:
    name: Frontend (unit + tsc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Vitest (unit)
        run: npm test
      - name: TypeScript contra el baseline de deuda
        run: |
          set +e
          npx tsc > tsc.log 2>&1
          set -e
          count=$(grep -c "error TS" tsc.log || true)
          echo "errores tsc: ${count} (baseline 81)"
          if [ "${count}" -gt 81 ]; then
            echo "El número de errores de tsc aumentó respecto al baseline (81)."
            cat tsc.log
            exit 1
          fi

  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: feromap
          POSTGRES_PASSWORD: feromap
          POSTGRES_DB: feromap
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U feromap"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: local
      DATABASE_URL: postgresql+psycopg://feromap:feromap@localhost:5432/feromap
      DATA_DIR: ${{ github.workspace }}/data
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Migraciones
        run: alembic upgrade head
      - name: Pytest (unit + integración sin fase lenta)
        run: pytest tests/ -q -m "not slow and not phase_a and not phase_b"

  # E2E estricto (F1): requiere el stack completo con seed y caché del grafo.
  # Se deja como job manual hasta estabilizar el arranque en CI (ver riesgo de F3).
  e2e-strict:
    name: E2E estricto (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Levantar stack de desarrollo
        run: |
          if [ ! -f .env ]; then cp .env.example .env; fi
          docker compose -f compose.yml -f compose.dev.yml up -d --build
      - name: Migrar y sembrar
        run: |
          docker compose -f compose.yml -f compose.dev.yml exec -T api alembic upgrade head
          docker compose -f compose.yml -f compose.dev.yml exec -T api python -m scripts.seed_from_mocks
      - name: Smoke estricto (sin mocks)
        run: npm run test:e2e:strict
